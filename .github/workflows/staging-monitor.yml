# KV-49 (#51) staging izleme ve alarm. 30 dakikada bir (ve elle): API sağlığı, worker heartbeat'i, çalışan sürüm.
# Sorun varsa "staging-alarm" etiketli tek bir açık issue açılır/güncellenir; düzelince kapatılır. Secret gerekmez
# (yalnız public /health okunur). Ayrıntı: docs/KV-49_OPERATIONS.md "İzleme ve alarm".
name: staging-monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: staging-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging-45cb.up.railway.app' }}
      # Worker heartbeat'i 10 sn'de bir yazılır; 2 dakikadan eskiyse worker durmuş sayılır.
      MAX_WORKER_AGE_MS: "120000"
    steps:
      - name: Sağlık kontrolü
        id: health
        shell: bash
        run: |
          set -u
          problems=()
          body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$API_URL/health" || true)
          code=$(printf '%s' "$body" | tail -n1)
          json=$(printf '%s' "$body" | sed '$d')
          if [ "$code" != "200" ]; then
            problems+=("API /health HTTP $code")
          else
            status=$(printf '%s' "$json" | jq -r '.status // "?"')
            worker=$(printf '%s' "$json" | jq -r '.worker.status // "?"')
            age=$(printf '%s' "$json" | jq -er '.worker.ageMs | numbers' 2>/dev/null || echo "-1")
            sha=$(printf '%s' "$json" | jq -er '.release.sha | strings' 2>/dev/null || echo "bilinmiyor")
            [ "$status" = "ok" ] || problems+=("API durumu beklenenden farklı")
            [ "$worker" = "ready" ] || problems+=("worker hazır değil")
            if ! [[ "$age" =~ ^[0-9]{1,10}$ ]] || [ "$age" -gt "$MAX_WORKER_AGE_MS" ]; then
              problems+=("worker heartbeat geçersiz veya eski")
            fi
            # A missing SHA must not make a stale/unidentifiable deployment look healthy.
            # Validate before writing any untrusted health value to GITHUB_OUTPUT.
            if ! [[ "$sha" =~ ^[0-9a-f]{12}$ ]]; then
              sha="bilinmiyor"
              problems+=("deploy SHA eksik veya geçersiz")
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Staging sağlığı"
            echo "- API: \`$API_URL\` → HTTP $code"
            echo "- Çalışan sürüm: \`${sha:-?}\`"
            if [ ${#problems[@]} -eq 0 ]; then echo "- Sonuç: ✅ sorun yok"; else printf -- '- ✖ %s\n' "${problems[@]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${problems[@]}" > problems.txt
          [ ${#problems[@]} -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      # Web (Vercel) ayrı yayınlanır; API sağlıklıyken web çökmüş ya da yanlış (demo) build yayında olabilir (#187).
      # Ana sayfa 200 dönmeli ve sayfa api modunda olmalı: demo modu RSC payload'ında "demo":true olarak görünür.
      - name: Web kontrolü
        id: web
        env:
          WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://kararver-staging.vercel.app' }}
        shell: bash
        run: |
          set -u
          problems=()
          code=$(curl -sS -L --max-redirs 3 --max-time 20 -o web.html -w '%{http_code}' "${WEB_URL%/}/") || code="000"
          if [ "$code" != "200" ]; then
            problems+=("web ana sayfa HTTP $code (500 ise loglarda event=demo_mode_forbidden olabilir)")
          elif grep -qE '\\"demo\\":true|"demo":true|demo-banner|demo-controls' web.html; then
            problems+=("web demo modunda yayında (\"demo\":true): yanlış build")
          fi
          {
            echo "- Web: \`$WEB_URL\` → HTTP $code"
            if [ ${#problems[@]} -gt 0 ]; then printf -- '- ✖ %s\n' "${problems[@]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${problems[@]}" >> problems.txt
          [ ${#problems[@]} -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      # Railway yalnız CI'ı yeşil main commit'ini deploy eder. 9–12 Ekim'de main 3 gün kırmızı kaldı ve staging API hiç
      # güncellenmedi; Vercel ise her merge'ü aldı (yeni web + eski API). Bu adım iki durumu da alarma çevirir:
      # (1) staging, CI'ı yeşil son main commit'inin DEPLOY_LAG_MAX_MIN dakikadan uzun süre gerisinde,
      # (2) main CI'ı MAIN_RED_MAX_HOURS saattir kırmızı (staging bu sürede yeni sürüm alamaz).
      - name: Deploy gecikmesi ve main CI
        id: lag
        if: steps.health.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ steps.health.outputs.sha }}
          # Kabul testi için staging bilerek bir SHA'da tutuluyorsa (#46/#47 "aynı SHA" kuralı) repo değişkeni olarak verilir.
          # Doluyken gecikme alarmı yerine "staging sabitlenen SHA'da mı" denetlenir; iş bitince değişken silinir.
          STAGING_PINNED_SHA: ${{ vars.STAGING_PINNED_SHA }}
          DEPLOY_LAG_MAX_MIN: "60"
          MAIN_RED_MAX_HOURS: "24"
        shell: bash
        run: |
          set -u
          problems=()
          now=$(date -u +%s)
          # Son 30 tamamlanmış main push çalıştırması (en yeni önce); iptal edilenler karar vermez.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/foundation.yml/runs?branch=main&event=push&status=completed&per_page=30" \
            --jq '.workflow_runs[] | select(.conclusion != "cancelled") | "\(.conclusion) \(.head_sha) \(.updated_at)"' 2>/dev/null || true)
          green=$(printf '%s\n' "$runs" | awk '$1 == "success" { print; exit }')
          latest=$(printf '%s\n' "$runs" | head -n1)
          if [ -z "$runs" ]; then
            echo "- Deploy gecikmesi: CI geçmişi okunamadı (atlandı)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # (2) main uzun süredir kırmızı mı?
          if [ "${latest%% *}" = "failure" ]; then
            last_green_at=$(printf '%s' "$green" | awk '{ print $3 }')
            red_hours=$(( (now - $(date -u -d "${last_green_at:-1970-01-01T00:00:00Z}" +%s)) / 3600 ))
            if [ "$red_hours" -ge "$MAIN_RED_MAX_HOURS" ]; then
              problems+=("main CI ${red_hours} saattir kırmızı: staging yeni sürüm alamıyor")
            fi
          fi

          # (1) staging, CI'ı yeşil son main commit'inin gerisinde mi? Sabitlenmişse yerine sabit SHA'da mı?
          green_sha=$(printf '%s' "$green" | awk '{ print $2 }')
          green_at=$(printf '%s' "$green" | awk '{ print $3 }')
          pinned="${STAGING_PINNED_SHA:-}"
          if [ -n "$pinned" ] && ! [[ "$pinned" =~ ^[0-9a-f]{7,40}$ ]]; then
            problems+=("STAGING_PINNED_SHA geçersiz (7–40 haneli küçük harf hex olmalı)")
            pinned=""
          fi
          if [ -n "$pinned" ]; then
            # Kısa ya da uzun SHA: ortak önek karşılaştırılır.
            n=$(( ${#pinned} < 12 ? ${#pinned} : 12 ))
            if [ "${STAGING_SHA:0:$n}" = "${pinned:0:$n}" ]; then
              echo "- Staging bilerek sabitlendi: \`${pinned:0:12}\` (gecikme alarmı kapalı; değişken silinince açılır)" >> "$GITHUB_STEP_SUMMARY"
            else
              problems+=("staging sabitlenen SHA'da değil: beklenen ${pinned:0:12}, çalışan ${STAGING_SHA} (kabul testi sırasında beklenmeyen deploy)")
            fi
          elif [[ "$STAGING_SHA" =~ ^[0-9a-f]{12}$ ]] && [[ "$green_sha" =~ ^[0-9a-f]{40}$ ]] && [ "${green_sha:0:12}" != "$STAGING_SHA" ]; then
            # "ahead": yeşil commit staging'in ilerisinde. "behind"/"identical": staging daha yeni ya da aynı (alarm yok).
            # Yalnız API/worker'ı etkileyen değişiklik sayılır: web (Vercel), doküman ve workflow değişikliği API deploy'u gerektirmez.
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$STAGING_SHA...$green_sha" --jq '.status' 2>/dev/null || echo "bilinmiyor")
            api_changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$STAGING_SHA...$green_sha" --jq '.files[].filename' 2>/dev/null \
              | grep -Ev '^(apps/web/|docs/|\.github/)|\.md$' | wc -l || echo 0)
            lag_min=$(( (now - $(date -u -d "$green_at" +%s)) / 60 ))
            if [ "$relation" = "ahead" ] && [ "$api_changes" -gt 0 ] && [ "$lag_min" -ge "$DEPLOY_LAG_MAX_MIN" ]; then
              problems+=("staging main'in gerisinde: çalışan ${STAGING_SHA}, CI'ı yeşil son main ${green_sha:0:12} (${lag_min} dk önce, API'yi etkileyen ${api_changes} dosya)")
            fi
          fi

          # (3) staging main dışı bir commit mi çalıştırıyor? (ör. elle deploy edilen PR dalı.) main...staging "ahead" ya da
          # "diverged" ise staging'de main'de olmayan commit vardır. Bu commit'lerdeki migration'lar staging DB'sine uygulanmış
          # olur; dal birleşmeden değişirse sonraki main deploy'u migration geçmişiyle çatışır. Staging main'i izler (KV-49).
          if [[ "$STAGING_SHA" =~ ^[0-9a-f]{12}$ ]]; then
            off_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$STAGING_SHA" --jq '"\(.status) \(.ahead_by)"' 2>/dev/null || echo "bilinmiyor 0")
            off_status=${off_main%% *}
            off_by=${off_main##* }
            if [ "$off_status" = "ahead" ] || [ "$off_status" = "diverged" ]; then
              migrations=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$STAGING_SHA" --jq '[.files[].filename | select(startswith("packages/db/prisma/migrations/"))] | length' 2>/dev/null || echo "?")
              problems+=("staging main dışı commit çalıştırıyor: ${STAGING_SHA} main'de değil (${off_by} commit, ${migrations} migration dosyası); staging main'den deploy edilmeli")
            fi
          fi

          {
            echo "- Son yeşil main: \`${green_sha:0:12}\` · son main CI: ${latest%% *}"
            if [ ${#problems[@]} -gt 0 ]; then printf -- '- ✖ %s\n' "${problems[@]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${problems[@]}" >> problems.txt
          [ ${#problems[@]} -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Alarm issue'sunu aç / güncelle / kapat
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.health.outputs.ok == 'true' && steps.web.outputs.ok == 'true' && steps.lag.outputs.ok != 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh label create staging-alarm --color B60205 --description "KV-49 staging izleme alarmı" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label staging-alarm --state open --json number --jq '.[0].number // empty')
          if [ "$OK" = "true" ]; then
            if [ -n "$open" ]; then gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "✅ Staging yeniden sağlıklı ($RUN_URL)."; fi
            exit 0
          fi
          msg=$(printf '**Staging sağlık kontrolü başarısız** (%s)\n\n%s\n\nRunbook: docs/KV-49_OPERATIONS.md "Olay müdahalesi". Sorumlu: @farukkemree' "$RUN_URL" "$(grep -v '^$' problems.txt | sed 's/^/- /')")
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$msg"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label staging-alarm --title "Staging alarmı: sağlık kontrolü başarısız" --body "$msg"
          fi
          exit 1

name: Scheduled encrypted backup
# #186 / #51 — 0 TL zamanlanmış şifreli PostgreSQL 18 yedeği (Render Free uyuduğu için worker içi yedek güvenilir değil).
# Gerçek koşu (yalnız `schedule` ve yetkili kişinin elle tetiklemesi):
#   1) tek anlık döküm alınır ve AYRI, temiz bir PostgreSQL 18'e restore edilip 52 migration + tutarlılıkla doğrulanır;
#   2) DOĞRULANAN AYNI döküm (sha256 manifestle eşleşerek) RSA açık anahtarla zarf şifrelemesiyle şifrelenir; düz döküm
#      silinir (özel anahtar ekip dışında, çevrimdışı; CI'da YOK);
#   3) yalnız şifreli dosyalar (döküm + manifest) 35 gün saklanan artifact olur; public loga sayı/tablo adı yazılmaz; 4) ANCAK yükleme başarılıysa ops_backup_runs kaydı yazılır (/admin/ops);
#   5) yapılandırma eksikse ya da herhangi bir adım düşerse iş FAIL olur ve `backup-alarm` issue'su açılır.
# PR'da yalnız `validate` işi çalışır: secret'a ERİŞMEZ, veritabanına bağlanmaz, PR kodu secret'la çalışmaz.
# Ayrıntı: docs/KV-48_BACKUP_RESTORE.md "Zamanlanmış yedek: GitHub Actions".
#
# Gerekenler (Mehmet; değerler repoya/issue'ya yazılmaz):
#   secrets.STAGING_BACKUP_DATABASE_URL  Neon DOĞRUDAN (pooler olmayan) adres; tercihen okuma + ops_backup_runs ekleme rolü
#   vars.BACKUP_PUBLIC_KEY               RSA (≥ 3072 bit) açık anahtar, PEM
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/scheduled-backup.yml
      - apps/worker/scripts/scheduled-backup.ts
      - apps/worker/scripts/record-backup-run.ts
      - apps/worker/src/jobs/backup/**
permissions:
  contents: read
concurrency:
  group: scheduled-backup-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    # PR doğrulaması: secret yok, veritabanı yok; yalnız iş tanımı ve yedek kodunun testleri.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --filter "@kararver/worker..."
      - run: cd apps/worker && node --test test/directory-upload.test.ts test/scheduled-backup.test.ts
      - name: Gerçek yedek işi PR'da çalışmaz
        run: |
          echo "PR koşusu - gerçek yedek yalnız schedule ve yetkili workflow_dispatch'te çalışır (secret kullanılmadı)."

  backup:
    # Yalnız zamanlanmış koşu ya da yetkili kişinin elle tetiklemesi (owner + ops sorumlusu).
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["mehmetalisahingm","farukkemree"]'), github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: kararver
          POSTGRES_PASSWORD: kararver_local
          POSTGRES_DB: kararver
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kararver -d kararver"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_BIN: /usr/lib/postgresql/18/bin
      WORK: ${{ runner.temp }}/backup
      OUT: ${{ runner.temp }}/out
    steps:
      - name: Yapılandırma (eksikse FAIL + alarm)
        env:
          HAS_DB: ${{ secrets.STAGING_BACKUP_DATABASE_URL != '' }}
          HAS_KEY: ${{ vars.BACKUP_PUBLIC_KEY != '' }}
        run: |
          if [ "$HAS_DB" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::STAGING_BACKUP_DATABASE_URL secret'ı ya da BACKUP_PUBLIC_KEY değişkeni yok: YEDEK ALINMADI."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Bağımlılıklar (yalnız db + worker)
        run: pnpm install --frozen-lockfile --filter "@kararver/db..." --filter "@kararver/worker..."
      - name: PostgreSQL 18 istemcisi (resmî PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/kararver-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          "$PG_BIN/pg_dump" --version
      - name: 1) Tek döküm → ayrı temiz PG 18'e restore → doğrulama
        id: verify
        env:
          DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          RESTORE_DATABASE_URL: postgresql://kararver:kararver_local@127.0.0.1:5432/kararver_restore_check
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          # Repo public: Actions logu herkese açık. Araç çıktısı (satır sayıları, tablo/kontrol adları) yalnız runner'daki
          # dosyaya yazılır; loga yalnız sonuç satırı düşer. Ayrıntı gerekirse aynı adım yerelde çalıştırılır (KV-48).
          # --no-record: başarı kaydı yalnız 4. adımda, artifact yayımlandıktan sonra yazılır.
          if ! node packages/db/ops/backup.ts --out "$WORK" --no-record > "$RUNNER_TEMP/backup.log" 2>&1; then
            echo "::error::db:backup başarısız (ayrıntı public loga yazılmaz)"; exit 1
          fi
          file=$(sed -n 's/^yedek: \(.*\.dump\)$/\1/p' "$RUNNER_TEMP/backup.log")
          test -f "$file" && test -f "$file.manifest.json"
          echo "yedek alındı: $(basename "$file") ($(grep -c '⚠' "$RUNNER_TEMP/backup.log" || true) uyarı)"
          if ! node packages/db/ops/restore.ts --file "$file" > "$RUNNER_TEMP/restore.log" 2>&1; then
            echo "::error::restore doğrulaması başarısız: $(grep -c '✖' "$RUNNER_TEMP/restore.log" || true) kontrol düştü (ayrıntı public loga yazılmaz)"; exit 1
          fi
          grep -q '^SONUÇ: yedek eksiksiz' "$RUNNER_TEMP/restore.log"
          echo "restore doğrulandı: $(grep -c '✔' "$RUNNER_TEMP/restore.log" || true) kontrol geçti"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: 2) Doğrulanan AYNI dökümü şifrele (kayıt yazılmaz)
        env:
          DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
          APP_ENV: staging
          BACKUP_FROM_FILE: ${{ steps.verify.outputs.file }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/out
          BACKUP_DESTINATION: github-actions
          BACKUP_PREFIX: db/staging
          BACKUP_SKIP_RECORD: 'true'
          # Manifest satır sayıları ve şema kataloğu taşır: o da şifrelenir; düz manifest yalnız $WORK'te kalır (4. adım).
          BACKUP_ENCRYPT_MANIFEST: 'true'
        run: |
          set -euo pipefail
          node apps/worker/scripts/scheduled-backup.ts > "$RUNNER_TEMP/encrypt.log" 2>&1 || { echo "::error::şifreleme başarısız"; exit 1; }
          test ! -e "$BACKUP_FROM_FILE"                                   # düz döküm silindi
          ! find "$OUT" -type f ! -name '*.enc' | grep -q .               # artifact'ta yalnız şifreli dosya
          find "$OUT" -type f -name '*.dump.enc' | grep -q .
          find "$OUT" -type f -name '*.manifest.json.enc' | grep -q .
          find "$OUT" -type f -printf '%f\n'
      - name: 3) Artifact (35 gün)
        uses: actions/upload-artifact@v4
        with:
          name: kararver-db-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 35
          if-no-files-found: error
      - name: 4) Yayımlandıktan SONRA yedek kaydı (/admin/ops)
        env:
          DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          BACKUP_DESTINATION: github-actions
        run: |
          set -euo pipefail
          # Düz manifest artifact'ta yok; doğrulanan dökümün yanında (runner'da) duruyor.
          node apps/worker/scripts/record-backup-run.ts --manifest "${{ steps.verify.outputs.file }}.manifest.json"
      - name: Temizlik
        if: always()
        run: rm -rf "$WORK" "$OUT" "$RUNNER_TEMP/backup.log" "$RUNNER_TEMP/restore.log" "$RUNNER_TEMP/encrypt.log"
      - name: Başarıda açık alarmı kapat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label backup-alarm --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$open" ]; then gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "✅ Yedek yeniden başarılı (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."; fi
      - name: Başarısızlıkta alarm
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create backup-alarm --color B60205 --description "Zamanlanmış yedek başarısız (#186)" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label backup-alarm --state open --json number --jq '.[0].number // empty')
          msg="**Zamanlanmış şifreli yedek başarısız** ($RUN_URL). Yedek alınmamış olabilir. Runbook: docs/KV-48_BACKUP_RESTORE.md \"Zamanlanmış yedek: GitHub Actions\". Sorumlu: @farukkemree"
          if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$msg"; else gh issue create -R "$GITHUB_REPOSITORY" --title "Yedek alarmı: zamanlanmış yedek başarısız" --label backup-alarm --body "$msg"; fi

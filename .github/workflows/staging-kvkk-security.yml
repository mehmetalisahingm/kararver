name: Staging KVKK security smoke
on:
  pull_request:
    paths:
      - "scripts/staging-kvkk-smoke.mjs"
      - ".github/workflows/staging-kvkk-security.yml"
  workflow_dispatch:
jobs:
  public-negative-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify staging health and unauthenticated KVKK endpoints
        run: node scripts/staging-kvkk-smoke.mjs
